<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

  <title>Fridge Track</title>
  <meta name="description" content="Seguimiento de vencimientos de la heladera" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/classes.css" />
  <link rel="stylesheet" href="/css/logger.css" />
  <link rel="stylesheet" href="/css/cache-control.css" />
  <link rel="stylesheet" href="/css/btn.css" />
  <link rel="stylesheet" href="/css/input.css" />
  <link rel="stylesheet" href="/css/location-chips.css" />
  <link rel="stylesheet" href="/css/toast.css" />
  <link rel="stylesheet" href="/css/install-banner.css" />

  <script src="/js/app.js" type="module" defer></script>
</head>

<body>
  <!-- Application -->
  <div id="app">
    <header id="mainHeader">
      <div class="page-title"></div>
      <div class="header-icons">
        <div id="goBack2" class="go-back"></div>
        <div id="historyNavBtn" class="history-nav"></div>
        <div id="logoutBtn"></div>
      </div>
    </header>

    <div class="views">
      <!-- Auth (login/signup) -->
      <div id="authView" class="page">
        <form id="authForm" class="base-form">
          <h3 class="form-title">
            <span class="form-title-text">Iniciar Sesión</span>
          </h3>
          <div class="form-content">
            <div id="authNameField" class="form-control display-none">
              <label for="authName">Nombre</label>
              <input type="text" name="authName" placeholder="Tu nombre" autocomplete="name" />
            </div>
            <div class="form-control">
              <label for="authEmail">Email</label>
              <input type="email" name="authEmail" placeholder="tu@email.com" autocomplete="email" />
            </div>
            <div class="form-control">
              <label for="authPassword">Contraseña</label>
              <input type="password" name="authPassword" placeholder="Contraseña" autocomplete="current-password" />
            </div>
            <div class="submit"><!--  --></div>
            <div id="authModeToggle" class="mode-toggle" role="button">¿No tenés cuenta? Creá una</div>
          </div>
        </form>
      </div>

      <!-- Home (create/join) -->
      <div id="homeView" class="page">
        <div class="home-chips"><!--  --></div>

        <form id="homeForm" class="base-form">
          <h3 class="form-title">
            <span class="form-title-text">Crear Hogar</span>
          </h3>
          <div class="form-content">
            <div id="homeNameField" class="form-control">
              <label for="homeName">Nombre</label>
              <input type="text" name="homeName" placeholder="ej. Casa" />
            </div>
            <div id="joinCodeField" class="form-control display-none">
              <label for="joinCode">Código de invitación</label>
              <input type="text" name="joinCode" placeholder="ej. AB12CD" autocomplete="off" />
            </div>
            <div class="submit"><!--  --></div>
            <div id="homeModeToggle" class="mode-toggle" role="button">¿Tenés un código? Unite a un Hogar existente</div>
          </div>
        </form>
      </div>

      <!-- Item List -->
      <div id="itemListView" class="page">
        <div class="home-switcher" data-click-action="openHomeSwitcher">
          <span class="home-switcher-name"></span>
          <span class="home-switcher-code"></span>
        </div>
        <div class="location-chips"><!--  --></div>

        <div class="search-container" class="display-none">
          <div id="searchToggleBtn" class="search-toggle"><!--  --></div>
          <label for="searchItem"></label>
          <input type="text" name="search" id="searchItem" placeholder="buscar" autocomplete="off" />
        </div>

        <div class="list">
          <!--  -->
        </div>
        <div class="btns">
          <div id="newItemBtn" role="button" class="base-button">&plus;</div>
        </div>
      </div>

      <!-- Single Item -->
      <div id="singleItemView" class="page">
        <div class="heading">
          <h3 class="name"><!-- --></h3>
          <div class="right-side">
            <div class="delete-btn"> <!--  --> </div>
            <div class="edit-btn"><!--  --></div>
          </div>
        </div>

        <div class="status-summary">
          <div class="flex-container">
            <div class="status-badge"><!-- --></div>
            <div class="due-detail"><!-- --></div>
          </div>
          <div class="quantity-detail"><!-- --></div>
          <div class="expiry-detail"><!-- --></div>
          <div class="notes-detail"><!-- --></div>
        </div>

        <div class="btns">
          <div id="usedBtn"></div>
          <div id="discardedBtn"></div>
        </div>
      </div>

      <!-- Food Name History -->
      <div id="foodHistoryView" class="page">
        <div class="list"><!--  --></div>
      </div>
    </div>

    <!-- Modal -->
    <div id="main-modal" class="modal">
      <div class="backdrop">
        <div class="close-modal">&times;</div>
      </div>

      <div class="content">
        <!-- Location Form (Create/Edit) -->
        <form id="locationForm" class="base-form">
          <h3 class="form-title">
            <span class="form-title-text">Nueva Ubicación</span>
            <div id="deleteLocationBtn" class="display-none"></div>
          </h3>
          <div class="form-content">
            <div class="form-control">
              <label for="locationName">Nombre</label>
              <input type="text" name="locationName" placeholder="ej. Heladera" />
            </div>
            <div class="submit"><!--  --></div>
          </div>
        </form>

        <!-- Item Form (Create/Edit) -->
        <form id="itemForm" class="base-form">
          <h3 class="form-title">Nuevo Alimento</h3>
          <div class="form-content">
            <div class="form-control name-field">
              <label for="itemName">Nombre</label>
              <input type="text" name="itemName" placeholder="ej. Leche" autocomplete="off" />
              <div class="name-suggestions"><!--  --></div>
            </div>
            <div class="form-control">
              <label for="quantity">Cantidad</label>
              <input type="text" name="quantity" placeholder="ej. 1 litro" />
            </div>
            <div class="form-control">
              <label for="useByDate">Vencimiento</label>
              <div class="due-inputs">
                <input type="date" name="useByDate" />
                <span class="due-divider">o en</span>
                <input type="number" step="1" min="0" name="shelfLifeDays" placeholder="días" />
              </div>
            </div>
            <div class="form-control">
              <label for="addedDate">Fecha agregado</label>
              <input type="date" name="addedDate" />
            </div>
            <div class="form-control">
              <label for="itemNotes">Notas</label>
              <textarea rows="3" name="itemNotes"></textarea>
            </div>
            <div class="submit"><!--  --></div>
          </div>
        </form>
      </div>
    </div>

    <div id="mainFooter" class="display-none">
      <div id="indexedDbVersion"></div>
      <div id="cacheMajorVersion"></div>
    </div>
  </div>

  <!-- Cache update banner -->
  <div id="updateBanner" class="folded">
    <p>Hay una nueva versión disponible</p>
    <button id="refreshPageBtn">Refrescá la página para actualizar</button>
  </div>

  <!-- Undo toast -->
  <div id="undoToast" class="folded">
    <span class="message"></span>
    <div id="undoBtn" role="button" class="undo-btn">Deshacer</div>
  </div>

  <!-- Error toast (user-facing validation/notice messages) -->
  <div id="errorToast" class="folded">
    <span class="message"></span>
  </div>

  <!-- Info toast (neutral confirmations, e.g. "copied to clipboard") -->
  <div id="infoToast" class="folded">
    <span class="message"></span>
  </div>

  <!-- Install prompt banner -->
  <div id="installBanner" class="folded">
    <span class="message"></span>
    <div id="installBtn" role="button" class="install-btn">Instalar</div>
    <div id="dismissInstallBtn" role="button" class="dismiss-btn">&times;</div>
  </div>

  <!-- Logger -->
  <div id="logger" class="display-none">
    <div id="closeLogsBtn">
      <h4>Cerrar logs</h4>
    </div>
    <div id="logs"></div>
  </div>
</body>

</html>
